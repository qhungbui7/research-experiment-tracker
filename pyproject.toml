[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-experiment-tracker"
version = "1.0.0"
description = "A generalized experiment tracking, review lineage, and scientific methodology framework for research projects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Hung Bui", email = "bqhung127@gmail.com"}
]
keywords = [
    "research",
    "experiment-tracking",
    "lineage",
    "reproducibility",
    "scientific-computing",
    "machine-learning",
    "reinforcement-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
experiment-tracker = "experiment_tracker.cli:main"
research-tracker = "experiment_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["experiment_tracker*"]

[tool.setuptools.package-data]
experiment_tracker = [
    "templates/*.html",
    "templates/scaffold/*.md"
]
